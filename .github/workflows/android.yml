name: Build Lazos de Luto - 50 diseños

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      google_upload_key_reset_approved:
        description: "Google Play approved the upload-key reset and the five signing secrets are configured"
        required: true
        type: boolean
        default: false

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack complete source if present
        run: |
          ZIP="LazosDeLuto50_GitHub.zip"
          if [ ! -f "$ZIP" ] && [ -f "Lazos-de-Luto-2.0-50-Lazos-Publicacion-Fuente-Actualizado.zip" ]; then
            ZIP="Lazos-de-Luto-2.0-50-Lazos-Publicacion-Fuente-Actualizado.zip"
          fi
          if test -f "$ZIP"; then
            echo "Unpacking complete 50-design Android source archive"
            unzip -o -q "$ZIP" -d .
          else
            echo "No complete source archive found; will validate assets."
          fi
          count=$(find app/src/main/assets/lazos -maxdepth 1 -name 'lazo_*.jpg' 2>/dev/null | wc -l)
          echo "Image count: $count"
          if [ "$count" -ne 50 ]; then
            echo "::error::Missing actual 50 JPG assets! Upload the full source ZIP to the repository root."
            exit 1
          fi
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || exit 1
          grep -q 'versionCode 9' app/build.gradle || exit 1
          grep -q "targetSdk 36" app/build.gradle || exit 1
      - name: Apply redesigned home screen and messages
        run: |
          python3 scripts/upgrade_ui.py
          python3 scripts/monetization_v22.py
          grep -q 'private void enterCategory' app/src/main/java/gratis/lazosdeluto/MainActivity.java
          grep -q 'versionCode 11' app/build.gradle
          grep -q "targetSdk 36" app/build.gradle
      - name: Enable Android 7-9 compatibility and bump release version
        run: |
          python3 scripts/compatibility_api23.py
          grep -q 'minSdk 24' app/build.gradle
          grep -q 'versionCode 13' app/build.gradle
      - name: Restore Android 4.4+ device compatibility
        run: |
          python3 scripts/compatibility_api19.py
          grep -q 'minSdk 19' app/build.gradle
          grep -q 'versionCode 17' app/build.gradle
      - name: Fix App Open start lifecycle and bump to version 2.2.7
        run: |
          python3 scripts/monetization_v227.py
          grep -q 'versionCode 18' app/build.gradle
          grep -q "versionName '2.2.7'" app/build.gradle
          grep -q 'minSdk 19' app/build.gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Install Android SDK 36
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR" || { echo "Android sdkmanager not found"; exit 1; }
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Verify privacy and supported SDK versions
        run: |
          grep -q 'play-services-ads:22.6.0' app/build.gradle
          grep -q 'user-messaging-platform:2.2.0' app/build.gradle
          grep -q 'targetSdk 36' app/build.gradle
          grep -q 'ACCESS_COARSE_LOCATION.*tools:node="remove"' app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_FINE_LOCATION.*tools:node="remove"' app/src/main/AndroidManifest.xml
      - name: Verify legacy Android compatibility
        run: |
          grep -q 'minSdk 19' app/build.gradle
          grep -q 'targetSdk 36' app/build.gradle
          grep -q 'versionCode 18' app/build.gradle
          grep -q 'androidx.multidex:multidex:2.0.1' app/build.gradle
          grep -q "versionName '2.2.7'" app/build.gradle
          grep -q 'android.hardware.touchscreen.*required="false"' app/src/main/AndroidManifest.xml
          grep -q 'android.hardware.faketouch.*required="false"' app/src/main/AndroidManifest.xml
          grep -q 'android.hardware.screen.portrait.*required="false"' app/src/main/AndroidManifest.xml
          grep -q 'Build.VERSION.SDK_INT>=23' app/src/main/java/gratis/lazosdeluto/MainActivity.java
      - name: Build debug APK (Google test ad IDs)
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK 50
        uses: actions/upload-artifact@v4
        with:
          name: Lazos-de-Luto-2.2-APK-PRUEBA-50
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Configure release signing (when upload key secrets are provided)
        id: signing
        env:
          LAZOS_UPLOAD_KEYSTORE_BASE64: ${{ ((github.event_name == 'workflow_dispatch' && inputs.google_upload_key_reset_approved) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && secrets.LAZOS_UPLOAD_KEYSTORE_BASE64 || '' }}
          LAZOS_UPLOAD_KEYSTORE_PASSWORD: ${{ ((github.event_name == 'workflow_dispatch' && inputs.google_upload_key_reset_approved) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && secrets.LAZOS_UPLOAD_KEYSTORE_PASSWORD || '' }}
          LAZOS_UPLOAD_KEY_ALIAS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.google_upload_key_reset_approved) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && secrets.LAZOS_UPLOAD_KEY_ALIAS || '' }}
          LAZOS_UPLOAD_KEY_PASSWORD: ${{ ((github.event_name == 'workflow_dispatch' && inputs.google_upload_key_reset_approved) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && secrets.LAZOS_UPLOAD_KEY_PASSWORD || '' }}
          LAZOS_UPLOAD_CERT_PEM_BASE64: ${{ ((github.event_name == 'workflow_dispatch' && inputs.google_upload_key_reset_approved) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && secrets.LAZOS_UPLOAD_CERT_PEM_BASE64 || '' }}
        run: python3 scripts/configure_signing.py
      - name: Build release AAB
        env:
          LAZOS_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.LAZOS_UPLOAD_KEYSTORE_PASSWORD }}
          LAZOS_UPLOAD_KEY_ALIAS: ${{ secrets.LAZOS_UPLOAD_KEY_ALIAS }}
          LAZOS_UPLOAD_KEY_PASSWORD: ${{ secrets.LAZOS_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace bundleRelease
      - name: Inspect release AAB content
        run: python3 scripts/verify_bundle.py
      - name: Verify signed AAB jar signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          jarsigner -verify -verbose app/build/outputs/bundle/release/app-release.aab | tail -n 25
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab 2>&1 | grep -q 'jar verified'
      - name: Upload signed AAB
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Lazos-de-Luto-2.2.7-CODIGO18-AAB-FIRMADO
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Upload unsigned AAB (not Play uploadable)
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Lazos-de-Luto-2.2-AAB-SIN-FIRMA
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
