name: Build Lazos de Luto
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Lazos-de-Luto-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: Build unsigned AAB
        run: gradle --no-daemon bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Lazos-de-Luto-AAB-UNSIGNED
          path: app/build/outputs/bundle/release/*.aab
